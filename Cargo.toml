[package]
name = "chess-rs-lib"
version = "1.1.2"
edition = "2021"
default-run = "ember"
 
[[bin]]
name = "ember"
path = "src/main.rs"

[lib]
name = "chess_rs_lib"
path = "src/lib.rs"
 
[dependencies]
mimalloc = { version = "0.1.52", optional = true }
rand = { version = "0.8", features = ["small_rng"] }
shakmaty = "0.30"
shakmaty-syzygy = { version = "0.28", features = ["mmap"] }

[features]
default = []
decision-trace = []
mimalloc = ["dep:mimalloc"]
search-debug = []
 
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
