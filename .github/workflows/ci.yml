name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix develop .#ci --command cargo fmt --all --check

      - name: Run clippy
        run: >
          nix develop .#ci --command cargo clippy --locked
          --all-targets --all-features -- -D warnings

      - name: Run native tests
        run: |
          nix develop .#ci --command bash -c "
            ulimit -s 65536
            export RUST_MIN_STACK=16777216
            cargo test --locked --all-features -- --test-threads=1
          "
        env:
          RUST_BACKTRACE: 1

      - name: Run Python tool tests
        run: >
          nix develop .#ci --command python3 -m unittest discover
          -s tools/tests -p 'test_*.py'

      - name: Run Windows runner tests
        run: >
          nix develop .#ci --command python3 -m unittest discover
          -s windows/tests -p 'test_*.py'

      - name: Run old x86 CPU smoke under QEMU
        if: matrix.runner == 'ubuntu-latest'
        run: tools/test-x86_64-qemu-oldcpu.sh

      - name: Retry failed tests with backtrace
        if: failure()
        run: |
          nix develop .#ci --command bash -c "
            ulimit -s 65536
            export RUST_MIN_STACK=16777216
            export RUST_BACKTRACE=full
            cargo test --locked --all-features -- --test-threads=1 --nocapture
          "

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            target/debug/deps/*.stdout
            target/debug/deps/*.stderr
          retention-days: 7

  lichess-puzzle-corpus:
    name: Move regression fixtures
    runs-on: ubuntu-latest

    env:
      RUST_BACKTRACE: 1
      EMBER_LICHESS_CORPUS_THREADS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run move regression fixtures
        run: |
          nix develop .#ci --command bash -c "
            ulimit -s 65536
            export RUST_MIN_STACK=16777216
            cargo test --locked --release --all-features --test lichess_puzzle_corpus -- --ignored --test-threads=4
          "

  windows-msvc:
    name: Windows MSVC build smoke
    runs-on: windows-2022
    needs:
      - rust

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: >
        -C target-cpu=x86-64-v3
        -C target-feature=+crt-static
        -C link-arg=/STACK:16777216

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install nightly-2026-07-07 `
            --profile minimal `
            --component clippy `
            --component rustfmt `
            --target x86_64-pc-windows-msvc
          rustup default nightly-2026-07-07
          rustup show

      - name: Configure Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native MSVC binary
        shell: pwsh
        run: >
          cargo build --locked --release --bin ember
          --target x86_64-pc-windows-msvc

      - name: Run native UCI smoke test
        shell: pwsh
        run: >
          python tools/smoke_test_uci.py --
          target/x86_64-pc-windows-msvc/release/ember.exe

      - name: Run native UCI stress test
        shell: pwsh
        run: >
          python tools/stress_test_uci.py --
          target/x86_64-pc-windows-msvc/release/ember.exe

      - name: Check static MSVC runtime
        shell: pwsh
        run: |
          $binary = "target/x86_64-pc-windows-msvc/release/ember.exe"
          $imports = & dumpbin /dependents $binary
          $imports
          if ($imports -match "(?i)ucrtbase|vcruntime|msvcp[0-9]") {
            throw "$binary imports a dynamic MSVC runtime"
          }

      - name: Upload native MSVC binary
        uses: actions/upload-artifact@v4
        with:
          name: ember-windows-msvc-amd64
          path: target/x86_64-pc-windows-msvc/release/ember.exe
          if-no-files-found: error
          retention-days: 7

  release-linux-windows:
    name: Linux and Windows release binaries
    runs-on: ubuntu-latest
    needs:
      - rust
      - lichess-puzzle-corpus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux binaries
        run: |
          nix build .#ember-linux-amd64 --out-link result-linux-amd64
          nix build .#ember-linux-arm64 --out-link result-linux-arm64

      - name: Build Windows binaries
        run: |
          nix build .#ember-windows-amd64 --out-link result-windows-amd64
          nix build .#ember-windows-arm64 --out-link result-windows-arm64

      - name: Check binary formats and static linkage
        run: |
          set -euo pipefail

          file result-linux-amd64/bin/ember
          file result-linux-arm64/bin/ember
          readelf -h result-linux-amd64/bin/ember | grep -q 'Advanced Micro Devices X86-64'
          readelf -h result-linux-arm64/bin/ember | grep -q 'AArch64'
          if readelf -l result-linux-amd64/bin/ember | grep -q 'INTERP'; then
            echo "linux-amd64 has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -l result-linux-arm64/bin/ember | grep -q 'INTERP'; then
            echo "linux-arm64 has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -d result-linux-amd64/bin/ember 2>/dev/null | grep -q 'NEEDED'; then
            echo "linux-amd64 has dynamic dependencies" >&2
            exit 1
          fi
          if readelf -d result-linux-arm64/bin/ember 2>/dev/null | grep -q 'NEEDED'; then
            echo "linux-arm64 has dynamic dependencies" >&2
            exit 1
          fi

          nix develop .#release-ci --command \
            llvm-readobj --file-headers result-windows-amd64/bin/ember.exe \
            | grep -q 'IMAGE_FILE_MACHINE_AMD64'
          nix develop .#release-ci --command \
            llvm-readobj --file-headers result-windows-arm64/bin/ember.exe \
            | grep -q 'IMAGE_FILE_MACHINE_ARM64'
          version="$(
            nix develop .#ci --command python3 -c \
              'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])'
          )"
          grep -aFq "id name Ember $version" result-windows-amd64/bin/ember.exe
          grep -aFq "id name Ember $version" result-windows-arm64/bin/ember.exe

          for binary in \
            result-windows-amd64/bin/ember.exe \
            result-windows-arm64/bin/ember.exe
          do
            imports="$(
              nix develop .#release-ci --command \
                llvm-readobj --coff-imports "$binary"
            )"
            if grep -Eiq 'ucrtbase|vcruntime|msvcp[0-9]' <<<"$imports"; then
              echo "$binary imports a dynamic MSVC runtime" >&2
              exit 1
            fi
          done

      - name: Run packaged UCI smoke tests
        run: |
          nix develop .#release-ci --command python3 tools/smoke_test_uci.py \
            -- result-linux-amd64/bin/ember

          nix develop .#release-ci --command \
            python3 tools/smoke_test_uci.py \
            -- qemu-aarch64 result-linux-arm64/bin/ember

          mkdir -p "$RUNNER_TEMP/ember-wine"
          WINEDEBUG=-all \
          WINEPREFIX="$RUNNER_TEMP/ember-wine" \
            nix develop .#release-ci --command \
              python3 tools/smoke_test_uci.py --timeout 60 \
              -- wine result-windows-amd64/bin/ember.exe

          nix develop .#release-ci --command python3 tools/stress_test_uci.py \
            -- result-linux-amd64/bin/ember

          nix develop .#release-ci --command \
            python3 tools/stress_test_uci.py --timeout 60 \
            -- qemu-aarch64 result-linux-arm64/bin/ember

      - name: Quick no-book NPS smoke benchmark
        run: |
          nix develop .#ci --command python3 tools/benchmark_search.py \
            --binary ember=result-linux-amd64/bin/ember \
            --depth 7 \
            --repeats 1 \
            --hash-mb 64 \
            --timeout 60 \
            --run-id ci-quick-nps \
            --out-dir results/search-bench

          nix develop .#ci --command python3 - <<'PY'
          import json
          import os

          result_path = "results/search-bench/ci-quick-nps/result.json"
          with open(result_path, encoding="utf-8") as f:
              result = json.load(f)

          summary = result["summaries"]["ember"]
          samples = result["samples"]
          median_nps = round(summary["median_nps"])
          mean_nps = round(summary["mean_nps"])

          lines = [
              "## Quick NPS Smoke",
              "",
              f"- Book disabled: `{str(result['disable_book']).lower()}`",
              f"- Depth: `{result['depth']}`",
              f"- Repeats: `{result['repeats']}`",
              f"- Median NPS: `{median_nps}`",
              f"- Mean NPS: `{mean_nps}`",
              "",
              "| Position | Depth | Nodes | NPS |",
              "| --- | ---: | ---: | ---: |",
          ]
          for sample in samples:
              lines.append(
                  f"| {sample['position']} | {sample['reported_depth']} | "
                  f"{sample['nodes']} | {sample['nps']} |"
              )
          lines.append("")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines))
          else:
              print("\n".join(lines))

          print(
              "::notice title=Quick NPS::"
              f"median={median_nps}, mean={mean_nps}, "
              f"samples={summary['samples']}, book=disabled"
          )
          PY

      - name: Create release archives
        run: |
          nix develop .#ci --command python3 tools/package_release_archive.py \
            --binary result-linux-amd64/bin/ember \
            --platform linux-amd64 \
            --commit "$GITHUB_SHA"
          nix develop .#ci --command python3 tools/package_release_archive.py \
            --binary result-linux-arm64/bin/ember \
            --platform linux-arm64 \
            --commit "$GITHUB_SHA"
          nix develop .#ci --command python3 tools/package_release_archive.py \
            --binary result-windows-amd64/bin/ember.exe \
            --platform windows-amd64 \
            --commit "$GITHUB_SHA"
          nix develop .#ci --command python3 tools/package_release_archive.py \
            --binary result-windows-arm64/bin/ember.exe \
            --platform windows-arm64 \
            --commit "$GITHUB_SHA"

      - name: Upload Linux and Windows release archives
        uses: actions/upload-artifact@v4
        with:
          name: ember-release-linux-windows
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release-macos:
    name: macOS tests and release binaries
    runs-on: macos-15

    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require an ARM64 runner
        run: test "$(uname -m)" = arm64

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix develop .#ci --command cargo fmt --all --check

      - name: Run clippy
        run: >
          nix develop .#ci --command cargo clippy --locked
          --all-targets --all-features -- -D warnings

      - name: Run native tests
        run: |
          nix develop .#ci --command bash -c "
            ulimit -s 65536
            export RUST_MIN_STACK=16777216
            cargo test --locked --all-features -- --test-threads=1
          "

      - name: Run Python tool tests
        run: >
          nix develop .#ci --command python3 -m unittest discover
          -s tools/tests -p 'test_*.py'

      - name: Run Windows runner tests
        run: >
          nix develop .#ci --command python3 -m unittest discover
          -s windows/tests -p 'test_*.py'

      - name: Run move regression fixtures
        run: |
          nix develop .#ci --command bash -c "
            ulimit -s 65536
            export RUST_MIN_STACK=16777216
            fixture_threads=\"\$(sysctl -n hw.logicalcpu)\"
            export EMBER_LICHESS_CORPUS_THREADS=\"\$fixture_threads\"
            cargo test --locked --release --all-features --test lichess_puzzle_corpus -- --ignored --test-threads=\"\$fixture_threads\"
          "

      - name: Build macOS binaries
        run: |
          nix build .#ember-macos-arm64 --out-link result-macos-arm64
          nix build .#ember-macos-amd64 --out-link result-macos-amd64

      - name: Check architectures and dynamic dependencies
        run: |
          set -euo pipefail

          file result-macos-arm64/bin/ember
          file result-macos-amd64/bin/ember
          test "$(lipo -archs result-macos-arm64/bin/ember)" = arm64
          test "$(lipo -archs result-macos-amd64/bin/ember)" = x86_64

          for binary in \
            result-macos-arm64/bin/ember \
            result-macos-amd64/bin/ember
          do
            while read -r dependency _; do
              case "$dependency" in
                /usr/lib/*|/System/Library/*) ;;
                *)
                  echo "$binary has a non-system dependency: $dependency" >&2
                  exit 1
                  ;;
              esac
            done < <(otool -L "$binary" | tail -n +2)
          done

      - name: Run packaged UCI smoke tests
        run: |
          nix develop .#ci --command python3 tools/smoke_test_uci.py \
            -- result-macos-arm64/bin/ember

          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          nix develop .#ci --command python3 tools/smoke_test_uci.py \
            -- /usr/bin/arch -x86_64 result-macos-amd64/bin/ember

          nix develop .#ci --command python3 tools/stress_test_uci.py \
            -- result-macos-arm64/bin/ember

          nix develop .#ci --command python3 tools/stress_test_uci.py \
            -- /usr/bin/arch -x86_64 result-macos-amd64/bin/ember

      - name: Create release archives
        run: |
          nix develop .#ci --command python3 tools/package_release_archive.py \
            --binary result-macos-arm64/bin/ember \
            --platform macos-arm64 \
            --commit "$GITHUB_SHA"
          nix develop .#ci --command python3 tools/package_release_archive.py \
            --binary result-macos-amd64/bin/ember \
            --platform macos-amd64 \
            --commit "$GITHUB_SHA"

      - name: Upload macOS release archives
        uses: actions/upload-artifact@v4
        with:
          name: ember-release-macos
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
