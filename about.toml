# Regenerate licenses/THIRD-PARTY-LICENSES.html with:
# cargo about generate --locked --fail --all-features about.hbs --output-file licenses/THIRD-PARTY-LICENSES.html
accepted = ["Apache-2.0", "MIT", "Unicode-3.0"]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

